services:
  - type: web
    name: naxastudio-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://naxastudio-backend.onrender.com
      - key: API_BASE_URL
        value: https://naxastudio-backend.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: nexastudio
